<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALCC AI Receptionist — Demo</title>
<style>
:root{--green:#075e54;--light:#e9f5f3;--bg:#efeae2;--text:#172033}
*{box-sizing:border-box} body{margin:0;background:#dfe5e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
.phone{width:min(100%,440px);height:100vh;min-height:680px;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.head{background:var(--green);color:white;padding:14px 16px;display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:50%;background:white;color:var(--green);display:grid;place-items:center;font-weight:800}
.name{font-weight:700;font-size:15px}.sub{font-size:12px;opacity:.9;margin-top:2px}
.chat{flex:1;overflow:auto;padding:14px;background:var(--bg)}
.msg{max-width:88%;padding:10px 12px;border-radius:10px;margin:7px 0;font-size:14px;line-height:1.45;box-shadow:0 1px 1px #0001}
.bot{background:#fff;border-top-left-radius:3px}.user{background:#d9fdd3;margin-left:auto;border-top-right-radius:3px}
.time{font-size:9px;text-align:right;color:#7b8490;margin-top:4px}
.quick{display:flex;gap:6px;overflow:auto;padding:8px;background:#f6f6f6;border-top:1px solid #ddd}
.quick button{white-space:nowrap;border:1px solid #cbd5d1;background:white;border-radius:18px;padding:8px 11px;font-size:12px}
.input{display:flex;gap:7px;padding:9px;background:white;border-top:1px solid #ddd}
.input input{flex:1;border:1px solid #ccd4d8;border-radius:22px;padding:11px 14px;outline:none}
.send{width:44px;border:0;border-radius:50%;background:var(--green);color:white;font-size:18px}
.disclaimer{font-size:10px;color:#667085;text-align:center;padding:5px 8px;background:white}
.card{background:#f7fbfa;border:1px solid #d8e9e5;border-radius:10px;padding:10px;margin-top:6px}
a{color:#075e54;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
<header class="head">
  <div class="logo">ALCC</div>
  <div><div class="name">Agrawal Skin Care, Laser & Cosmetic Centre</div><div class="sub">AI Receptionist • Demo</div></div>
</header>
<main id="chat" class="chat"></main>
<nav class="quick">
  <button onclick="quick('clinic')">Clinic info</button>
  <button onclick="quick('doctor')">Doctor</button>
  <button onclick="quick('services')">Services</button>
  <button onclick="quick('timings')">Timings</button>
  <button onclick="quick('appointment')">Appointment</button>
  <button onclick="quick('contact')">Contact</button>
</nav>
<div class="input"><input id="input" placeholder="Type your question..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>
<div class="disclaimer">Demo receptionist. It does not diagnose conditions, prescribe treatment, or confirm real appointments.</div>
</div>

<script>
const chat=document.getElementById('chat');
let step=0, lead={};

function add(text,who='bot'){
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML=text+'<div class="time">now</div>';
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function bot(t){setTimeout(()=>add(t),280)}
function quick(t){add(t,'user');reply(t)}
function send(){const i=document.getElementById('input');const t=i.value.trim();if(!t)return;i.value='';add(t,'user');reply(t)}

function reply(raw){
 const t=raw.toLowerCase();

 if(step===1){lead.name=raw;step=2;bot('Thanks, '+lead.name+'. What day would you like to visit?');return}
 if(step===2){lead.day=raw;step=3;bot('What time would you prefer? Please note that this demo does not check the live clinic calendar.');return}
 if(step===3){lead.time=raw;step=0;bot('Thank you. I have recorded this appointment request:<div class="card"><b>Name:</b> '+lead.name+'<br><b>Preferred day:</b> '+lead.day+'<br><b>Preferred time:</b> '+lead.time+'</div><br>For a real deployment, this would be sent to the clinic team for confirmation.');return}

 if(/^(hi|hello|hey|namaste)/i.test(t)){bot('Namaste! 👋 I am the AI receptionist for <b>Agrawal Skin Care, Laser & Cosmetic Centre</b>, Mathura.<br><br>I can help with clinic information, doctor information, services, timings, contact details and appointment requests.');return}
 if(t.includes('doctor')||t.includes('anil')){
   bot('<b>Dr. Anil Agrawal</b><br>MBBS — GSVM Medical College, Kanpur<br>MD (Skin & V.D.) — B.R.D. Medical College, Gorakhpur<br><br>The clinic website also states that he received additional observer training at Nanavati Hospital & Research Centre, Mumbai and AIIMS, New Delhi.');
   return;
 }
 if(t.includes('service')||t.includes('treatment')||t.includes('laser')||t.includes('cosmetic')){
   bot('<b>Clinic areas:</b><br>• Clinical dermatology<br>• Cosmetology<br>• Dermatosurgery<br>• Laser and cosmetic care<br><br>For a specific skin condition or treatment suitability, the patient should consult the doctor rather than relying on this chatbot.');
   return;
 }
 if(t.includes('time')||t.includes('open')||t.includes('hour')){
   bot('<b>Listed clinic hours:</b><br>Mon–Sat: 11:00 AM–2:30 PM and 6:00 PM–7:30 PM<br>Sun: 11:00 AM–2:30 PM<br><br><b>Online consultation:</b> 12:00 PM–2:00 PM, according to the clinic website.<br><small>Hours can change, so please confirm before visiting.</small>');
   return;
 }
 if(t.includes('appointment')||t.includes('book')||t.includes('schedule')){
   step=1;bot('Sure. I can record an <b>appointment request</b>. What is your name?');
   return;
 }
 if(t.includes('contact')||t.includes('phone')||t.includes('call')){
   bot('You can contact the clinic at:<div class="card">📞 <a href="tel:+918979838444">8979838444</a><br>📞 <a href="tel:+917534071819">7534071819</a><br>✉️ alccmathura@gmail.com</div>');
   return;
 }
 if(t.includes('address')||t.includes('location')||t.includes('where')){
   bot('<b>Clinic address:</b><br>In front of Bank of Baroda, near Peter England Showroom (Mehta Hospital), B-41, Krishna Nagar, Mathura, Uttar Pradesh 281004.<br><br><a href="https://www.google.com/maps/search/?api=1&query=Agrawal+Skin+Care+Laser+Cosmetic+Centre+Mathura" target="_blank">📍 Open in Google Maps</a>');
   return;
 }
 if(t.includes('fee')||t.includes('price')||t.includes('cost')){
   bot('I do not have a verified current fee schedule, so I will not invent one. Please call the clinic for current consultation or treatment charges.');
   return;
 }
 if(t.includes('diagnos')||t.includes('medicine')||t.includes('prescription')||t.includes('what do i have')){
   bot('I can provide clinic information, but I cannot diagnose a condition or prescribe medicines. For medical advice, please consult the doctor at the clinic.');
   return;
 }
 bot('I can help with <b>clinic info, doctor, services, timings, appointment requests, contact details, location, or fees</b>. Try one of those topics.');
}

add('Namaste! 👋<br>I am the <b>AI receptionist for Agrawal Skin Care, Laser & Cosmetic Centre</b>, Mathura.<br><br>How can I help you today?');
</script>
</body>
</html>
